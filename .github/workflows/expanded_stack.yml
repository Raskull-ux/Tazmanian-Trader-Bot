name: Expanded stack (find the edge)
on:
  repository_dispatch:
    types: [expanded_stack]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy pyarrow scikit-learn
      - run: set -o pipefail; python expanded_stack.py 2>&1 | tail -120
      - name: Commit results
        run: |
          git config user.name "taz-bot"; git config user.email "taz-bot@users.noreply.github.com"
          git add results/expanded
          git diff --cached --quiet && exit 0
          git commit -m "Expanded stack results"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
