name: Chart Data Pull
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests openpyxl
      - name: Download charts
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python chart_data_pull.py
      - name: Save to repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results/chart_data || true
          git commit -m "Chart data for exact-time trades" || true
          git pull --rebase || true
          git push || true
