name: Long Daily Pull
on:
  workflow_dispatch:
  repository_dispatch:
    types: [long_daily]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas yfinance
      - run: python long_daily_pull.py 2>&1 | tee pull.log
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results/long_daily || true
          git commit -m "Long daily history (Yahoo)" || true
          git pull --rebase || true
          git push || true
          msg=$(cat pull.log | awk '{printf "%s%%0A", $0}'); echo "::notice title=long daily::${msg}"
