name: Research bars
on:
  repository_dispatch:
    types: [research_bars]
permissions:
  contents: write
concurrency:
  group: research-bars
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - name: Pull bars
        env:
          ALPACA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID || secrets.ALPACA_API_KEY_ID || secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY || secrets.ALPACA_API_SECRET_KEY || secrets.ALPACA_SECRET_KEY }}
          SYMS: ${{ github.event.client_payload.syms }}
          TFS: ${{ github.event.client_payload.tfs || '15Min,30Min,1Hour' }}
          START: ${{ github.event.client_payload.start || '2024-01-01' }}
        run: python research_bars.py
      - name: Commit
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add results/research/
          git diff --cached --quiet || (git commit -m "Research bars" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done)
