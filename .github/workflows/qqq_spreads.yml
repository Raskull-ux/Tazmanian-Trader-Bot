name: QQQ Spread Pull
on:
  workflow_dispatch:
  repository_dispatch:
    types: [qqq_spreads]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests yfinance pyarrow
      - name: Pull
        env:
          ALPACA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID || secrets.ALPACA_API_KEY_ID || secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY || secrets.ALPACA_API_SECRET_KEY || secrets.ALPACA_SECRET_KEY }}
        run: python qqq_spread_pull.py 2>&1 | tee pull.log
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results/qqq_spreads || true
          git commit -m "QQQ next-day spread bars" || true
          git pull --rebase || true
          git push || true
          msg=$(tail -n 5 pull.log | awk '{printf "%s%%0A", $0}'); echo "::notice title=qqq spreads::${msg}"
