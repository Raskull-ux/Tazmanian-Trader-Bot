name: Recover Fill Times
on:
  workflow_dispatch:
    inputs:
      max_cost:
        description: "Hard Databento spending cap in USD"
        default: "10"
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pandas>=3.0" pyarrow numpy openpyxl databento
      - name: Recover missing fill times from 1-minute option prices
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY || vars.DATABENTO_API_KEY }}
          MAX_COST_USD: ${{ github.event.inputs.max_cost || '10' }}
        run: python recover_times.py
      - name: Save results + cache (always, even on cancel)
        if: always()
        run: |
          [ -d results/recovered_times ] || exit 0
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add results/recovered_times/
          git diff --cached --quiet || git commit -m "Recovered fill times $(date -u +%F)"
          git pull --rebase || true
          git push
