name: Track record
on:
  schedule:
    - cron: "50 22 * * 1-5"   # weekdays after the watchlist backup run: rebuild results/track_record.csv
    - cron: "7 22 * * 0"      # Sunday 5:07 PM EST: rebuild and post the weekly summary to the private channel
  workflow_dispatch:
    inputs:
      post:
        description: "Post the summary now (1 = yes)"
        default: ""
  push:
    branches: [main]
    paths: [track_record.py, .github/workflows/track_record.yml]
permissions:
  contents: write
concurrency:
  group: track-record
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests
      - env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.DISCORD_TOKEN || secrets.DISCORD_BOT_API || secrets.DISCORD_BOT_API_KEY || secrets.DISCORD_BOT || secrets.BOT_TOKEN || secrets.DISCORD_API_TOKEN || secrets.DISCORD_API }}
          PRIVATE_CHANNEL_ID: "1562327911866830949"
          POST: ${{ github.event.inputs.post || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python track_record.py
      - name: Save
        run: |
          git config user.name "taz-bot"; git config user.email "taz-bot@users.noreply.github.com"
          git add -f results/track_record.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "Track record"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
