name: Run Exit Analysis
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exit-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy openpyxl databento
      - name: Check Databento key is visible (never prints the key)
        env:
          S: ${{ secrets.DATABENTO_API_KEY }}
          V: ${{ vars.DATABENTO_API_KEY }}
        run: |
          if [ -n "$S" ]; then echo "Found DATABENTO_API_KEY as a repository SECRET"; fi
          if [ -n "$V" ]; then echo "Found DATABENTO_API_KEY as a repository VARIABLE"; fi
          if [ -z "$S$V" ]; then echo "DATABENTO_API_KEY NOT FOUND as secret or variable in this repo"; exit 1; fi
      - name: Run exit analysis
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY || vars.DATABENTO_API_KEY }}
          MAX_COST_USD: "70"
        run: python exit_analysis.py Tazmanian_Trade_Record.xlsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-analysis-results
          path: results/
      - name: Commit results + bar cache to repo (runs even if the analysis fails or is cancelled)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/
          git pull --rebase || true
          git commit -m "Exit analysis results + cache" || echo "nothing to commit"
          git push
