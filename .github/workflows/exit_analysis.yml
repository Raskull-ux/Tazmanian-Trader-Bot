name: Run Exit Analysis
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exit-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy openpyxl requests
      - name: Run exit analysis
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python exit_analysis.py Tazmanian_Trade_Record.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: exit-analysis-results
          path: results/
      - name: Commit results to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/
          git commit -m "Exit analysis results" || echo "nothing to commit"
          git push
