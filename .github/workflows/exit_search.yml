name: Exit Search
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests yfinance
      - name: Stage 1 - search stock moves
        env:
          ALPACA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID || secrets.ALPACA_API_KEY_ID || secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY || secrets.ALPACA_API_SECRET_KEY || secrets.ALPACA_SECRET_KEY }}
        run: python exit_search.py
      - name: Save stage 1
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results/exit_search || true
          git commit -m "Exit search stage 1 results" || true
          git pull --rebase || true
          git push || true
      - name: Stage 2 - real option prices for survivors
        env:
          ALPACA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID || secrets.ALPACA_API_KEY_ID || secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY || secrets.ALPACA_API_SECRET_KEY || secrets.ALPACA_SECRET_KEY }}
        run: python exit_options.py
      - name: Save stage 2
        if: always()
        run: |
          git add results/exit_options || true
          git commit -m "Exit search stage 2 results" || true
          git pull --rebase || true
          git push || true
