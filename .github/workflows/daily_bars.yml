name: Daily bars
on:
  repository_dispatch:
    types: [daily_bars]
jobs:
  bars:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - env:
          SYMS: ${{ github.event.client_payload.syms || 'QQQ' }}
          DAYS: ${{ github.event.client_payload.days || '12' }}
        run: python daily_bars.py
