name: Setup Backtest
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Tickers to test (comma list). Leave blank for the full universe."
        default: "QQQ,SPY"
      months:
        description: "Months of history"
        default: "9"
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: Run setup backtest
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SYMBOLS: ${{ github.event.inputs.symbols }}
          MONTHS: ${{ github.event.inputs.months || '9' }}
        run: python setup_backtest.py
      - name: Save results
        if: always()
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add results/setup_backtest/ || true
          git diff --cached --quiet || git commit -m "Setup backtest $(date -u +%F)"
          git push
